name: build-and-publish-image

# 触发：推到 main / 打 v* tag / 手动
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # 打 release 传 tar 包
  packages: write   # 推 GHCR 镜像

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/muse2api

jobs:
  build:
    name: build & push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR 仓库名必须全小写（owner 可能是 Kongbai333）
      - name: Normalize image name
        id: img
        run: echo "ref=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.ref }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### 镜像已推送到 GHCR"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.meta.outputs.digest }}"
            echo '```'
            echo '```bash'
            echo "docker pull ${{ steps.img.outputs.ref }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  offline-tar:
    name: release asset (离线 tar)
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Normalize image name
        id: img
        run: echo "ref=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull & save
        run: |
          IMG="${{ steps.img.outputs.ref }}"
          TAG="${GITHUB_REF_NAME}"
          OUT="muse2api-${TAG}-linux-amd64.tar.gz"
          docker pull "${IMG}:${TAG}"
          docker save "${IMG}:${TAG}" | gzip -1 > "${OUT}"
          sha256sum "${OUT}" > "${OUT}.sha256"
          ls -lh
          cat "${OUT}.sha256"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            muse2api-*.tar.gz
            muse2api-*.tar.gz.sha256
          fail_on_unmatched_files: true
